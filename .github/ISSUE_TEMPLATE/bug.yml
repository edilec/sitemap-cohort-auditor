name: Bug report
description: Report a reproducible problem in the CLI.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Sitemap Cohort Auditor. For vulnerabilities, use the private security-reporting link instead of this public form.
  - type: input
    id: version
    attributes:
      label: Sitemap Cohort Auditor version
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 24.14.0
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: macOS 26, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the command and the smallest non-sensitive sitemap input that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data-safety check
      options:
        - label: I removed credentials, personal data and confidential third-party URLs from this report.
          required: true
