name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and release (for example, v0.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Validate tag, package version, and changelog
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          cli_version="$(node ./bin/sitemap-cohort-auditor.mjs --version)"
          test "$RELEASE_TAG" = "v$package_version"
          test "$cli_version" = "$package_version"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          grep -Fq "## [$package_version] - " CHANGELOG.md
      - name: Run project verification
        run: npm run verify
      - name: Build checksummed release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          package_file="$(npm pack --json | node -e "let value=''; process.stdin.on('data', chunk => value += chunk).on('end', () => process.stdout.write(JSON.parse(value)[0].filename))")"
          mv "$package_file" release-assets/
          git rev-parse HEAD > release-assets/SOURCE_COMMIT
          cd release-assets
          sha256sum "$package_file" > "${package_file%.tgz}.SHA256SUMS"
      - name: Retain verified assets for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish approved release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Publish release from the existing tag
        shell: bash
        run: |
          set -euo pipefail
          expected_commit="$(tr -d '\r\n' < release-assets/SOURCE_COMMIT)"
          current_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          test "$expected_commit" = "$current_commit"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Sitemap Cohort Auditor $RELEASE_TAG"
